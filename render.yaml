services:
  - type: web
    name: reachinbox-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://frontend-rouge-two-96.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_BETWEEN_EMAILS_SEC
        value: 2
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 15
      - key: SESSION_SECRET
        generateValue: true

  - type: redis
    name: reachinbox-redis
    plan: free
    ipAllowList: []

databases:
  - name: reachinbox-db
    databaseName: reachinbox
    user: postgres
    plan: free
